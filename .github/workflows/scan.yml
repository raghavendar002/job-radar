name: scan

on:
  # Triggered twice a day by cron-job.org (see README). Also runnable from the Actions tab.
  workflow_dispatch:
  # Optional backup if cron-job.org ever stops. GitHub's scheduler can run late, so it's off by default.
  # schedule:
  #   - cron: "45 2 * * *"   # 08:15 IST
  #   - cron: "45 13 * * *"  # 19:15 IST

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan job boards
        run: python -m scanner

      - name: Publish results
        run: |
          git config user.name "job-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
